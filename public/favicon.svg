<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#85580C" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="60,6 108,30 108,90 60,114 12,90 12,30" fill="#121218" stroke="url(#goldGradient)" stroke-width="3" />
  <polygon points="60,12 102,33 102,87 60,108 18,87 18,33" fill="none" stroke="url(#silverGradient)" stroke-width="0.75" stroke-opacity="0.4" />
  
  <!-- Sleek Car Silhouette & Wings -->
  <path d="M30 68 C35 52, 45 42, 60 42 C75 42, 85 52, 90 68 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
  <path d="M38 60 Q60 54 82 60" stroke="url(#silverGradient)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Monogram EG text -->
  <text x="60" y="80" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="22" fill="url(#goldGradient)" letter-spacing="1.5">EG</text>
  <text x="60" y="93" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#E2E8F0" letter-spacing="3">CARS</text>
  
  <!-- Mini star accent -->
  <polygon points="60,20 62,25 67,26 63,30 64,35 60,32 56,35 57,30 53,26 58,25" fill="url(#goldGradient)" />
</svg>